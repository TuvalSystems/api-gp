spring.application.name=web

server.port=8006

eureka.client.service-url.defaultZone=http://172.32.1.8:8761/eureka


## configuracion pare el pool de conexion de varias conexiones a la vez tanto para tuval como para dynamics

dynamics.datasource.hikari.maximum-pool-size=20
dynamics.datasource.hikari.minimum-idle=5
dynamics.datasource.hikari.idle-timeout=300000
dynamics.datasource.hikari.connection-timeout=30000
dynamics.datasource.hikari.max-lifetime=1800000

tuval.datasource.hikari.maximum-pool-size=20
tuval.datasource.hikari.minimum-idle=5
tuval.datasource.hikari.idle-timeout=300000
tuval.datasource.hikari.connection-timeout=30000
tuval.datasource.hikari.max-lifetime=1800000


