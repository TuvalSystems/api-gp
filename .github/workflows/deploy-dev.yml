name: Build & Deploy DEV (Spring Boot Docker)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Give mvnw permission to execute
        run: chmod +x mvnw

      - name: Verifica si mvnw existe
        run: ls -l

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean install -Dspring.profiles.active=dev

      - name: Build Docker image
        run: |
          docker build . -t img_apigp:dev
          docker tag img_apigp:dev sistematuval/webservice-pruebas:img_apigp

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push sistematuval/webservice-pruebas:img_apigp

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_DEV_IP }}
          port: 22
          username: ${{ secrets.SERVER_DEV_USER }}
          key: ${{ secrets.SERVER_DEV_SSH_KEY }}
          script: |
            echo "📥 Pulling latest image from DockerHub..."
            docker pull sistematuval/webservice-pruebas:img_apigp

            echo "🧼 Stopping and removing previous container if exists..."
            docker stop apigp || true
            docker rm apigp || true

            echo "🗑️ Removing old image..."
            docker rmi sistematuval/webservice-pruebas:img_apigp || true

            echo "✅ Verifying pulled image ID..."
            IMAGE_ID=$(docker images --no-trunc --quiet sistematuval/webservice-pruebas:img_apigp)
            echo "✔️ Using image ID: $IMAGE_ID"

             echo "🚀 Running new container..."
            docker rmi sistematuval/webservice-pruebas:img_apigp || true
            docker run -it -d --network=host --name apigp \
              -e SPRING_PROFILES_ACTIVE=dev \
              sistematuval/webservice-pruebas:img_apigp
