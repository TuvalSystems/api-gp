name: Build & Deploy DEV (Spring Boot Docker)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Give mvnw permission to execute
        run: chmod +x mvnw

      - name: Verifica si mvnw existe
        run: ls -l

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean install -DskipTests

      - name: Build Docker image
        run: |
          docker build . -t img_apigp:dev
          docker tag img_apigp:dev sistematuval/webservice-pruebas:img_apigp

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push sistematuval/webservice-pruebas:img_apigp

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_DEV_IP }}
          port: 22
          username: ${{ secrets.SERVER_DEV_USER }}
          key: ${{ secrets.SERVER_DEV_SSH_KEY }}
          script: |
            echo "📥 Pulling latest image from DockerHub..."
            docker pull sistematuval/webservice-pruebas:img_apigp

            echo "🧼 Stopping and removing previous container if exists..."
            docker stop apigp || true
            docker rm apigp || true

            echo "🗑️ Removing old image..."
            docker rmi sistematuval/webservice-pruebas:img_apigp || true

            echo "✅ Verifying pulled image ID..."
            IMAGE_ID=$(docker images --no-trunc --quiet sistematuval/webservice-pruebas:img_apigp)
            echo "✔️ Using image ID: $IMAGE_ID"

             echo "🚀 Running new container..."
            docker rmi sistematuval/webservice-pruebas:img_apigp || true
            docker run -it -d --network=host --name apigp \
              -e SPRING_PROFILES_ACTIVE=dev \
              sistematuval/webservice-pruebas:img_apigp
      
      - name: Notify Success via Email 
        if: success()
        uses:  dawidd6/action-send-mail@v3
        with:
          server_address: mail.cosenco.ec
          server_port: 587
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Despliegue DEV exitoso - API GP"
          to: sistemas6@tuvalsa.com
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            El despliegue al entorno de desarrollo fue exitoso 🎉.
            Rama: develop
            Imagen: sistematuval/webservice-pruebas:img_apigp
            Fecha: ${{ github.event.head_commit.timestamp }}
            Autor: ${{ github.event.head_commit.author.name }}

      - name: Notify Failure via Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.cosenco.ec
          server_port: 587
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Error en despliegue DEV - API GP"
          to: sistemas6@tuvalsa.com
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Ocurrió un error durante el despliegue al entorno de desarrollo ❗
            Revisa el log del job en GitHub Actions:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}  
